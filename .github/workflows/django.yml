name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements_tests.txt
          requirements_lint.txt
    - name: Install Dependencies
      run: |
        python -m pip --disable-pip-version-check install --no-compile -r requirements_tests.txt
        python -m pip check
    - name: Run Tests
      run: |
        python -m pytest --cov=testapp --cov=tpay_module --cov-report term-missing
    - name: Lint
      run: python -m flake8 .
